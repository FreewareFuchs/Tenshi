name: Linux read-only checks

on:
  push:
    branches: [main, feature/linux-readonly-port]
    paths:
      - 'recoverydesk/**'
      - 'tests/**'
      - 'requirements-test-exfat.txt'
      - 'main.py'
      - 'start_linux.sh'
      - 'build_deb.py'
      - 'sync_release_version.py'
      - 'write_build_info.py'
      - 'prepare_release.py'
      - 'prepare_website_catalog.py'
      - 'check_website_release.py'
      - 'release_tools.py'
      - 'release_finalize.py'
      - '.github/workflows/prepare-release.yml'
      - 'packaging/linux/**'
      - '.github/workflows/linux-check.yml'
  pull_request:
    paths:
      - 'recoverydesk/**'
      - 'tests/**'
      - 'requirements-test-exfat.txt'
      - 'main.py'
      - 'start_linux.sh'
      - 'build_deb.py'
      - 'sync_release_version.py'
      - 'write_build_info.py'
      - 'prepare_release.py'
      - 'prepare_website_catalog.py'
      - 'check_website_release.py'
      - 'release_tools.py'
      - 'release_finalize.py'
      - '.github/workflows/prepare-release.yml'
      - 'packaging/linux/**'
      - '.github/workflows/linux-check.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: string
        default: ""


concurrency:
  group: linux-check-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set explicit release identity for preparation
        if: inputs.release != ''
        shell: bash
        env:
          RELEASE_LABEL: ${{ inputs.release }}
        run: |
          [[ "$RELEASE_LABEL" =~ ^(stable|beta\.[1-9][0-9]*)$ ]] || exit 2
          echo "TENSHI_RELEASE=$RELEASE_LABEL" >> "$GITHUB_ENV"
      - name: Check generated version metadata
        run: python3 sync_release_version.py --check
      - name: Install Tk and Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb e2fsprogs btrfs-progs xfsprogs desktop-file-utils dosfstools mtools ntfs-3g exfatprogs python3-venv
      - name: Compile source modules
        run: python3 -m compileall -q main.py recoverydesk tests
      - name: Smoke test
        run: |
          bash -n start_linux.sh
          bash start_linux.sh --smoke-test
      - name: Device safety regression tests
        run: python3 -m unittest discover -s tests -p 'test_linux*.py' -v
      - name: Full cross-platform regression suite (virtual X11, no raw hardware)
        timeout-minutes: 8
        env:
          TENSHI_SETTINGS_FILE: ${{ runner.temp }}/tenshi-linux-test-settings.json
          TENSHI_LOG_DIR: ${{ runner.temp }}/tenshi-linux-test-logs
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 -m unittest discover -s tests -q
      - name: Independently formatted FAT32 reference and resume test
        run: |
          command -v mkfs.fat
          command -v mcopy
          command -v mmd
          python3 -m unittest discover -s tests -p 'test_real_fat32_image.py' -v
      - name: Independently formatted NTFS reference and resume test
        run: |
          command -v mkntfs
          command -v ntfscp
          python3 -m unittest discover -s tests -p 'test_real_ntfs_image.py' -v
      - name: Independently formatted exFAT reference and resume test
        run: |
          command -v mkfs.exfat
          command -v fsck.exfat
          python3 -m venv "$RUNNER_TEMP/exfat-reference-venv"
          "$RUNNER_TEMP/exfat-reference-venv/bin/python" -m pip install --disable-pip-version-check -r requirements-test-exfat.txt
          "$RUNNER_TEMP/exfat-reference-venv/bin/python" -c 'from FATtools.Volume import vopen, vclose'
          "$RUNNER_TEMP/exfat-reference-venv/bin/python" -m unittest discover -s tests -p 'test_real_exfat_image.py' -v
      - name: Independently formatted ext4 image read/export test
        run: python3 -m unittest discover -s tests -p 'test_real_ext4_image.py' -v
      - name: Independently formatted Btrfs and XFS read/export tests
        run: |
          command -v mkfs.btrfs
          command -v mkfs.xfs
          python3 -m unittest discover -s tests -p 'test_real_advanced_images.py' -v
      - name: UI test under 1024x650 virtual X11
        run: |
          xvfb-run -a -s '-screen 0 1024x650x24' python3 - <<'PY'
          from recoverydesk.gui import RecoveryDeskApp
          app = RecoveryDeskApp()
          try:
              app.geometry('1024x650+0+0')
              app.update_idletasks()
              assert app.winfo_width() <= 1024, app.winfo_geometry()
              assert app.winfo_height() <= 650, app.winfo_geometry()
              for key in ('partition', 'files'):
                  app._select_main_tab(key)
                  app.update_idletasks()
                  assert app.tabs.winfo_height() >= 100, (key, app.tabs.winfo_height())
                  if key == 'files':
                      assert app.file_tree.winfo_ismapped(), 'File browser is hidden'
                      assert app.file_tree.winfo_height() >= 70, app.file_tree.winfo_height()
                      assert app.export_queue_collapsed, 'Queue must start collapsed'
                      assert not app.export_queue_bar.winfo_ismapped()
                      app._toggle_export_queue()
                      app.update_idletasks()
                      assert app.export_queue_bar.winfo_ismapped(), 'Progress bar is hidden after expanding'
                      before = app.file_tree.winfo_height()
                      app._toggle_export_queue()
                      app.update_idletasks()
                      assert app.export_queue_collapsed
                      assert not app.export_queue_bar.winfo_ismapped()
                      assert app.file_tree.winfo_height() > before, (before, app.file_tree.winfo_height())
                      app._toggle_export_queue()
                      app.update_idletasks()
                      assert app.export_queue_bar.winfo_ismapped(), 'Progress bar not restored'
          finally:
              app.destroy()
          PY
      - name: Build native DEB and validate desktop entry
        run: |
          desktop-file-validate packaging/linux/de.freewarefuchs.Tenshi.desktop
          if [ -n "${TENSHI_RELEASE:-}" ]; then
            VERSION=$(python3 -c 'from recoverydesk import __version__; print(__version__)')
            PACKAGE_VERSION=$(python3 -c 'import os; from recoverydesk import __version__; from build_deb import package_version_for_release; print(package_version_for_release(__version__, os.environ["TENSHI_RELEASE"]))')
            python3 build_deb.py --package-version "$PACKAGE_VERSION"
          else
            python3 build_deb.py
          fi
          dpkg-deb --info deb_output/*.deb
          cd deb_output
          sha256sum -c *.deb.sha256
      - name: Install and test packaged application without raw hardware
        env:
          TENSHI_SETTINGS_FILE: ${{ runner.temp }}/tenshi-installed-settings.json
          TENSHI_LOG_DIR: ${{ runner.temp }}/tenshi-installed-logs
        run: |
          sudo apt-get install -y ./deb_output/*.deb
          cd /tmp
          /usr/bin/tenshi-recovery --version
          /usr/bin/tenshi-recovery --smoke-test
          xvfb-run -a /usr/bin/python3 -EsB "$GITHUB_WORKSPACE/packaging/linux/check_installed.py"
      - name: Verify package removal
        run: |
          sudo apt-get purge -y tenshi-recovery
          test ! -e /usr/bin/tenshi-recovery
          test ! -e /usr/share/tenshi-recovery/main.py
          test ! -e /usr/share/applications/de.freewarefuchs.Tenshi.desktop
          test ! -e /usr/share/icons/hicolor/256x256/apps/tenshi-recovery.png
      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tenshi-3.0.3-Linux-DEB
          path: |
            deb_output/*.deb
            deb_output/*.deb.sha256
          if-no-files-found: error
